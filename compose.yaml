name: quespot

services:
  redis:
    image: redis:8.0-alpine
    container_name: quespot-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command:
      - /bin/sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}" --maxmemory 128mb --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    networks:
      - backend
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  app:
    image: ${APP_IMAGE:?APP_IMAGE must be set}
    container_name: quespot-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: -XX:InitialRAMPercentage=20 -XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
    mem_limit: 600m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  nginx:
    image: nginx:stable-alpine
    container_name: quespot-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    configs:
      - source: nginx-default
        target: /etc/nginx/conf.d/default.conf
    networks:
      - backend
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

configs:
  nginx-default:
    content: |
      server {
          listen 80;
          server_name _;

          client_max_body_size 10m;

          location / {
              proxy_pass http://app:8080;
              proxy_http_version 1.1;
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
              proxy_connect_timeout 5s;
              proxy_read_timeout 60s;
              proxy_send_timeout 60s;
          }
      }

volumes:
  redis-data:

networks:
  backend:
    driver: bridge
