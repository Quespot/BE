spring:
  application:
    name: quespot

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:false}
        use_sql_comments: ${JPA_USE_SQL_COMMENTS:false}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  jackson:
    deserialization:
      accept-single-value-as-array: true

server:
  port: 8080
  forward-headers-strategy: framework
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

app:
  swagger:
    local-server-url: ${SWAGGER_LOCAL_SERVER_URL:http://localhost:8080}
    production-server-url: ${SWAGGER_PRODUCTION_SERVER_URL:https://api.quespot.site}
  s3:
    bucket: ${AWS_S3_BUCKET:}
    region: ${AWS_REGION:ap-northeast-2}
    presigned-url-expiration-seconds: ${S3_PRESIGNED_URL_EXPIRATION_SECONDS:300}
    max-file-size-bytes: ${S3_MAX_FILE_SIZE_BYTES:10485760}
  profile:
    default-image-url: ${DEFAULT_PROFILE_IMAGE_URL:https://example.com/images/default-profile.png}
  oauth2:
    frontend-redirect-uri: ${OAUTH2_FRONTEND_REDIRECT_URI:http://localhost:5173/oauth/callback}
    allowed-frontend-redirect-uris: ${OAUTH2_ALLOWED_FRONTEND_REDIRECT_URIS:${OAUTH2_FRONTEND_REDIRECT_URI:http://localhost:5173/oauth/callback}}
    login-code-expiration-seconds: ${OAUTH2_LOGIN_CODE_EXPIRATION_SECONDS:60}
    link-request-expiration-seconds: ${OAUTH2_LINK_REQUEST_EXPIRATION_SECONDS:120}
    unlink-retry-delay-ms: ${OAUTH2_UNLINK_RETRY_DELAY_MS:30000}
    token-encryption-key: ${OAUTH2_TOKEN_ENCRYPTION_KEY:}
    google:
      enabled: ${GOOGLE_OAUTH_ENABLED:false}
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8080/api/auth/login/oauth2/code/google}
    kakao:
      enabled: ${KAKAO_OAUTH_ENABLED:false}
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      admin-key: ${KAKAO_ADMIN_KEY:}
      redirect-uri: ${KAKAO_OAUTH_REDIRECT_URI:http://localhost:8080/api/auth/login/oauth2/code/kakao}
    naver:
      enabled: ${NAVER_OAUTH_ENABLED:false}
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_CLIENT_SECRET:}
      redirect-uri: ${NAVER_OAUTH_REDIRECT_URI:http://localhost:8080/api/auth/login/oauth2/code/naver}
  firebase:
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:30}
    refresh-token-expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:14}
    refresh-token-cookie-secure: ${JWT_REFRESH_TOKEN_COOKIE_SECURE:false}
    refresh-token-cookie-same-site: ${JWT_REFRESH_TOKEN_COOKIE_SAME_SITE:Lax}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  mail:
    verification-code-expiration-minutes: ${MAIL_VERIFICATION_CODE_EXPIRATION_MINUTES:10}
    verification-code-request-window-minutes: ${MAIL_VERIFICATION_CODE_REQUEST_WINDOW_MINUTES:10}
    verification-code-request-limit: ${MAIL_VERIFICATION_CODE_REQUEST_LIMIT:5}
    verification-code-client-request-limit: ${MAIL_VERIFICATION_CODE_CLIENT_REQUEST_LIMIT:20}
    verification-code-failed-attempt-limit: ${MAIL_VERIFICATION_CODE_FAILED_ATTEMPT_LIMIT:5}
    verification-completion-expiration-minutes: ${MAIL_VERIFICATION_COMPLETION_EXPIRATION_MINUTES:30}
    verification-code-secret: ${MAIL_VERIFICATION_CODE_SECRET}
  tour-api:
    service-key: ${TOUR_API_SERVICE_KEY:}
    daily-limit: ${TOUR_API_DAILY_LIMIT:1000}
    scheduler:
      enabled: ${TOUR_API_SCHEDULER_ENABLED:false}
      cron: "${TOUR_API_SCHEDULER_CRON:0 0 4 * * *}"

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

debug: false
