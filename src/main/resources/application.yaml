spring:
  application:
    name: quespot

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

server:
  port: 8080

app:
  profile:
    default-image-url: ${DEFAULT_PROFILE_IMAGE_URL:https://example.com/images/default-profile.png}
  firebase:
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:30}
    refresh-token-expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:14}
    refresh-token-cookie-secure: ${JWT_REFRESH_TOKEN_COOKIE_SECURE:true}
    refresh-token-cookie-same-site: ${JWT_REFRESH_TOKEN_COOKIE_SAME_SITE:Lax}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  mail:
    verification-code-expiration-minutes: ${MAIL_VERIFICATION_CODE_EXPIRATION_MINUTES:10}
    verification-code-request-window-minutes: ${MAIL_VERIFICATION_CODE_REQUEST_WINDOW_MINUTES:10}
    verification-code-request-limit: ${MAIL_VERIFICATION_CODE_REQUEST_LIMIT:5}
    verification-code-client-request-limit: ${MAIL_VERIFICATION_CODE_CLIENT_REQUEST_LIMIT:20}
    verification-code-failed-attempt-limit: ${MAIL_VERIFICATION_CODE_FAILED_ATTEMPT_LIMIT:5}
    verification-completion-expiration-minutes: ${MAIL_VERIFICATION_COMPLETION_EXPIRATION_MINUTES:30}
    verification-code-secret: ${MAIL_VERIFICATION_CODE_SECRET}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

debug: false
